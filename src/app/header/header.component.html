<header class="app-header">
  <span class="header-date">
    <i class="bi bi-calendar3"></i>
    {{ today | date:'dd/MM/yyyy' }}
  </span>

  <span class="header-title">Deposito</span>

  <div class="header-profile">
    <button class="profile-btn" (click)="toggleMenu()">
      <i class="bi bi-person-circle"></i>
      <span>Nombre</span>
      <i class="bi bi-chevron-down"></i>
    </button>

    @if (menuOpen) {
      <div class="dropdown-backdrop" (click)="closeMenu()"></div>
      <nav class="dropdown-menu">
        <a routerLink="/registro-horas" (click)="closeMenu()">
          <i class="bi bi-clock"></i> Registro Horas
        </a>
        <a routerLink="/productos" (click)="closeMenu()">
          <i class="bi bi-box-seam"></i> Productos
        </a>
        <a routerLink="/reportes" (click)="closeMenu()">
          <i class="bi bi-bar-chart"></i> Reportes
        </a>
        <a routerLink="/empleados" (click)="closeMenu()">
          <i class="bi bi-people"></i> Empleados
        </a>
        <div class="dropdown-divider"></div>
        <button class="dropdown-logout" (click)="logout()">
          <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
        </button>
      </nav>
    }
  </div>
</header>
