<header class="app-header">
  <span class="header-date">
    <i class="bi bi-calendar3"></i>
    {{ today.toLocaleDateString('es-MX') }}
  </span>

  <span class="header-title">Deposito</span>

  <div class="header-profile">
    <button class="profile-btn" (click)="toggleMenu()">
      <i class="bi bi-person-circle"></i>
      <span>{{ nombreUsuario }}</span>
      <i class="bi bi-chevron-down"></i>
    </button>

    @if (menuOpen) {
      <div class="dropdown-backdrop" (click)="closeMenu()"></div>
      <nav class="dropdown-menu">
        <div class="dropdown-role">
          <small>{{ rolUsuario }}</small>
        </div>
        @for (opt of menuOptions; track opt.route) {
          <a [routerLink]="opt.route" (click)="closeMenu()">
            <i class="bi" [class]="opt.icon"></i> {{ opt.label }}
          </a>
        }
        @if (menuOptions.length > 0) {
          <div class="dropdown-divider"></div>
        }
        <button class="dropdown-logout" (click)="logout()">
          <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
        </button>
      </nav>
    }
  </div>
</header>
