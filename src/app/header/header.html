<header class="flex items-center justify-between px-6 py-3 bg-blue-950 text-white border-b border-blue-900/50">
  <!-- Fecha -->
  <span class="flex items-center gap-2 text-xs font-medium text-slate-400">
    <i class="bi bi-calendar3 text-blue-400"></i>
    {{ today.toLocaleDateString('es-MX') }}
  </span>

  <!-- Título -->
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center shadow-md shadow-blue-900/30">
      <i class="bi bi-shop text-sm text-white"></i>
    </div>
    <span class="font-bold text-sm tracking-wide text-white">Deposito Premium</span>
  </div>

  <!-- Perfil -->
  <div class="relative">
    <button
      (click)="toggleMenu()"
      class="flex items-center gap-2.5 px-3 py-1.5 text-xs text-slate-300 bg-slate-800/40 border border-slate-700/50 rounded-xl font-sans cursor-pointer transition-all hover:bg-slate-800 hover:border-slate-600 hover:text-white"
    >
      <div class="w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center text-white shadow-sm">
        <i class="bi bi-person text-xs"></i>
      </div>
      <span class="hidden sm:inline font-medium">{{ nombreUsuario }}</span>
      <i class="bi bi-chevron-down text-[0.55rem] text-slate-400"></i>
    </button>

    @if (menuOpen) {
      <div class="fixed inset-0 z-10" (click)="closeMenu()"></div>
      <nav class="absolute top-full right-0 mt-2 bg-white rounded-2xl min-w-[210px] py-2 shadow-2xl shadow-slate-300/40 border border-slate-100 z-20">
        <!-- User info -->
        <div class="px-4 py-3 border-b border-slate-100 bg-slate-50/50 rounded-t-2xl">
          <p class="text-xs font-semibold text-slate-700">{{ nombreUsuario }}</p>
          <p class="text-[10px] font-bold text-blue-600 uppercase mt-0.5 tracking-wider">{{ rolUsuario }}</p>
        </div>
        
        <div class="py-1">
          @for (opt of menuOptions; track opt.route) {
            <a
              [routerLink]="opt.route"
              (click)="closeMenu()"
              class="flex items-center gap-3 px-4 py-2.5 text-xs text-slate-600 font-medium no-underline cursor-pointer transition-colors hover:bg-slate-50 hover:text-blue-600"
            >
              <i class="bi text-sm text-slate-400" [class]="opt.icon"></i>
              <span>{{ opt.label }}</span>
            </a>
          }
        </div>
        
        <div class="h-px bg-slate-100 my-1"></div>
        
        <button
          (click)="logout()"
          class="flex items-center gap-3 w-full px-4 py-2.5 text-xs font-semibold text-red-500 bg-transparent border-none font-sans cursor-pointer transition-colors hover:bg-red-50"
        >
          <i class="bi bi-box-arrow-right text-sm text-red-400"></i>
          <span>Cerrar Sesión</span>
        </button>
      </nav>
    }
  </div>
</header>
